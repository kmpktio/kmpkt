name: Mutation tests

on:
  pull_request:

jobs:
  pitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Publish to Maven Local
        run: ./gradlew publishToMavenLocal
      - name: Restore Arcmutate license if configured
        env:
          ARCMUTATE_LICENCE: ${{ secrets.ARCMUTATE_LICENCE }}
        run: |
          if [ -n "$ARCMUTATE_LICENCE" ]; then
            printf '%s\n' "$ARCMUTATE_LICENCE" > arcmutate-licence.txt
          fi
      - name: Run Pitest
        run: ./gradlew pitest
      - name: Upload mutation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitest-reports
          path: "**/build/reports/pitest"
