name: Mutation tests

on:
  pull_request:

jobs:
  pitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history required so Arcmutate's git plugin can diff against origin/${{ github.base_ref }}.
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Publish to Maven Local
        run: ./gradlew publishToMavenLocal
      - name: Restore Arcmutate license if configured
        env:
          ARCMUTATE_LICENCE: ${{ secrets.ARCMUTATE_LICENCE }}
        run: |
          if [ -n "$ARCMUTATE_LICENCE" ]; then
            printf '%s\n' "$ARCMUTATE_LICENCE" > arcmutate-licence.txt
          fi
      - name: Run Pitest
        run: |
          if [ -f arcmutate-licence.txt ] && [ -n "${{ github.base_ref }}" ]; then
            ./gradlew pitest -Ppitest.features="+git(from[origin/${{ github.base_ref }}])"
          else
            ./gradlew pitest
          fi
      - name: Upload mutation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pitest-reports
          path: "**/build/reports/pitest"
